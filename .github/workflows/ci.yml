name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      # The sandbox tests need unprivileged user namespaces, which Ubuntu 24.04 restricts by default.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Configure git
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The server embeds web/dist at compile time.
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        working-directory: web
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (evals excluded)
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'not (binary(~_evals) | binary(=book_retrieval))'
      - run: cargo test --workspace --locked --doc

  frontend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [design, web, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
        working-directory: ${{ matrix.package }}
      - run: npm run typecheck
        working-directory: ${{ matrix.package }}
      - run: npx vitest run
        working-directory: ${{ matrix.package }}
      - run: npm run build
        working-directory: ${{ matrix.package }}
        if: matrix.package != 'design'

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/browser/package-lock.json
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Configure git
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-browser"
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
