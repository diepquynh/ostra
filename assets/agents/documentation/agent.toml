description = "Runs one step of the docs stage for one project, named by its Docs mode line. Survey: one brief pass over the code, project memory, workspace artifacts, the user's uploads and attachments, and the existing book, returning the inventory of what the book must cover and a plan of broad pages in groups. Page: writes or revises one page, checked against the code, with the problem, mechanism, reasons, cases, groups, user view, limits, and code of each area. Synthesis: reads every draft and the fact-check findings, judges the definition of done, and lists the edits that remove duplicated facts, contradictions, and gaps. Returns the result in its submit call; Ostra writes the book, and the agent writes no file."
default_tier = "advanced"
timeout_seconds = 2400
capabilities = ["read", "shell", "search_text", "glob", "code", "docs_search", "memory_recall"]

returns = "documentation"
write_scope = "session"
brief = ["stack", "commands", "modules"]

[effort]
native = "high"
claude = "high"
codex = "high"
grok = "high"
agy = "high"
