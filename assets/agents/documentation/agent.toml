description = "Writes one project's part of the workspace documentation book: the project overview, then the pages a reader needs to understand and change the project, with topics and structure the agent chooses from the user's instructions and the source. Each page is a summary and a free Markdown body with small Mermaid diagrams, tables, and code references last, plus the glossary terms it uses. Grounds every name in real source and writes each fact once. Returns the whole part in its submit call; Ostra writes the book, and the agent writes no file. Runs in the docs stage, after every phase has passed review, or directly when the user asks for documentation of existing code."
default_tier = "advanced"
timeout_seconds = 2400
capabilities = ["read", "shell", "search_text", "glob", "code", "docs_search"]

returns = "documentation"
write_scope = "session"
brief = ["stack", "commands", "modules"]

[effort]
native = "high"
claude = "high"
codex = "high"
grok = "high"
agy = "high"
