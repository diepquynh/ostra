description = "Reads one pipeline step that failed or got stuck, finds why from its inputs, its outputs, and the project, and tells Ostra how to continue: run the step again with concrete guidance, or ask the user when the fix needs a decision or a fact no agent has. Read-only."
default_tier = "advanced"
timeout_seconds = 900
capabilities = ["read", "shell", "search_text", "glob", "web_search", "web_fetch", "memory_recall"]

[effort]
native = "high"
claude = "high"
codex = "high"
grok = "high"
agy = "high"
