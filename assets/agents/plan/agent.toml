description = "Turns one approved spec into a master plan plus one self-contained file per phase, each step naming an exact path, a prose action, the skills to load, and a verification command. Phases carry their project, complexity, test policy, and dependencies so Ostra can schedule them. Runs once after spec approval for medium and high stakes. Takes every requirement from the spec and reads no research document, only the code facts Ostra extracts from them. Read-only on project source."
default_tier = "advanced"
timeout_seconds = 1800
capabilities = ["read", "shell", "search_text", "glob", "document", "code", "coordinate", "docs_search"]

[effort]
native = "high"
claude = "high"
codex = "high"
grok = "high"
agy = "high"
