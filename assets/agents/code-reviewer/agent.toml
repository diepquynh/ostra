description = "Reviews the unstaged working-tree changes of one review loop against the project's Review Rule Set and the phase file's requirements, and submits structured findings. Also runs a non-waivable security scan on every changed file, raising BLOCKER findings no instruction can override. Runs after an implementer or write-test execution. Read-only on project source."
default_tier = "balanced"
timeout_seconds = 1200
capabilities = ["read", "shell", "search_text", "glob", "code", "coordinate", "docs_search", "review_ledger", "security_block"]

returns = "review"
write_scope = "session"
brief = ["commands", "review", "conventions", "skills"]

[effort]
native = "high"
claude = "high"
codex = "high"
grok = "high"
agy = "high"
