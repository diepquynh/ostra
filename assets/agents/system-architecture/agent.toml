description = "Writes the system architecture of a documentation book that covers two or more projects: the components and what each owns, how they communicate and over which protocol, how each failure is detected and recovered, and how each component scales, with one flowchart of the components. Reads the parts the documentation writers returned and verifies the links in source. Returns the architecture in its submit call; Ostra writes the book, and the agent writes no file."
default_tier = "advanced"
timeout_seconds = 1800
capabilities = ["read", "shell", "search_text", "glob", "code", "docs_search"]

[effort]
native = "high"
claude = "high"
codex = "high"
grok = "high"
agy = "high"
