| 1 | Repository root | root | . |

## Existing Skills
| Name | Kind guess | Path | Description |
| --- | --- | --- | --- |
| none | none | none | none found |
"""
[case.expect]
action = "retry"
require = [["slices"]]
cause = "The scout plan on disk has the root slice, so the earlier guidance was followed. The submitted result named the list `slice_list` with `name` and `path` keys, while Ostra reads `result.slices`, each with `descriptor`, `slug`, and `paths` (a list), so the engine saw zero slices."
rubric = """Pass only if all hold: (1) the action is retry; (2) the guidance identifies that the plan file already lists the slice and that the problem is the submitted result: the key `slice_list` (with `name` and `path`) instead of `slices`; (3) it tells detect to submit the slice under `result.slices` in the shape its Submit paragraph shows. Naming the exact item keys `descriptor`, `slug`, and `paths` is good but not required. Fail if it escalates, or if it only repeats the earlier advice about planning a root slice without naming the result's shape."""

