# Advisor evals. Each case is a failed step of a created project's init (Rule O5), laid out on disk the way
# the engine leaves it, with the decision a careful engineer would make. `crates/ostra-server/tests/advisor_evals.rs`
# builds the advisor's spawn through the same `advisor_request` and spawn factory the engine uses, runs the real
# advisor in the native loop (policy and sandbox included), and scores its submit call: the action, facts its
# text must name, and a grader's verdict on the rubric.
#
# Placeholders in paths and text: {ws} workspace root, {repo} project root, {session} the project's session dir,
# {assets} Ostra's assets dir, {key} the project key. Every case's project is `notes-mcp` unless it sets
# `[case.project]`. The project folder is a fresh `git init` plus the case's files, because a created project is
# initialized right after it is created. `problem` defaults to what the engine writes for a stuck step
# (`stuck_problem`: the summary, then what it needs); `problem_check` computes it with the runner's own inventory and profile check.
#
# Several cases come in pairs with the same surface problem and opposite answers, so an advisor that pattern-
# matches the problem text instead of reading the files fails one of them.

[default_project]
key = "notes-mcp"
stack = "rust"
purpose = "A stdio MCP server that lets an AI agent search a team's notes and file follow-up tasks, reading PostgreSQL and publishing task events to a Redis stream."
requirements = [
  "Rust 2024 edition on the stable toolchain",
  "rmcp 3.5 as the MCP SDK, stdio transport only",
  "tokio multi-threaded runtime",
  "sqlx 0.8 with PostgreSQL and rustls TLS, reading NOTES_DB_URL",
  "redis 0.32 cluster client with TLS, adding task events to a stream with XADD",
  "Built with cargo; tests run with cargo test",
]

# ---------------------------------------------------------------------------------------------------------
# Detect
# ---------------------------------------------------------------------------------------------------------

[[case]]
id = "detect-stuck-empty-project"
note = "The first failure every created project risks: detect finds no code and stops instead of using the stack it was given."
mode = "detect"
result = '''
{"status": "stuck", "summary": "The repository has no source files, so the stack cannot be detected and no slices can be planned.",
 "files": [], "result": {},
 "stuck": {"step": "D1", "attempted": "Counted source files by extension and looked for manifests (Cargo.toml, package.json, pom.xml, go.mod).",
  "diagnostic": "find printed nothing: the repository holds only .git, and no manifest exists.",
  "ruled_out": ["a nested source directory", "a gitignored source tree"],
  "need": "The stack of this project and the directories to scout, because there is no code to detect them from."}}
'''
[case.expect]
action = "retry"
require = [["rust"], ["slice"]]
cause = "The project was created empty moments ago. Its stack is given in the User focus (Rust) and the initializer's instructions say an empty project still continues with the stack from the focus and one slice over the repository root."
rubric = """Pass only if all hold: (1) the action is retry; (2) the guidance tells detect to take the stack from the User focus or project context (Rust) instead of detecting it; (3) it tells detect to plan at least one slice that covers the repository root (for example `.`), not zero slices; (4) it does not ask the step to create source files or a manifest, or to run `cargo init` or `cargo new`. Naming the `_generic` reference (no Rust reference ships with Ostra) is good but not required."""

[[case]]
id = "detect-result-key-mismatch"
note = "Second round. The earlier guidance worked on disk, but the submitted result used the wrong key, so the engine saw no slices. Trap: escalating because guidance was already given."
mode = "detect"
earlier = ["Take the stack from the User focus (Rust) instead of detecting it, choose the `_generic` stack reference because no Rust reference exists, and plan one slice that covers the repository root (`.`), as the empty-project rule in Step D1 says. Do not create any files in the repository."]
problem = "Detect found no slices to scout and no existing skills, so there is nothing to build skills from."
result = '''
{"status": "ok", "summary": "Wrote the scout plan: Rust, _generic reference, one slice over the repository root.",
 "files": ["{session}/ostra-scout-plan.md"],
 "result": {"scout_plan_path": "{session}/ostra-scout-plan.md", "stack": "rust", "reference_name": "_generic",
  "slice_list": [{"name": "Repository root", "path": "."}], "existing_skills": [], "ultracode_bootstrap": false}}
'''
[[case.file]]
path = "{session}/ostra-scout-plan.md"
content = """# Scout Plan
Stack: rust · Reference: {assets}/refs/_generic.md
Repo root: {repo}
User focus: A new project `notes-mcp`, created in this session. Its folder is empty.
Ultracode bootstrap: no
Instruction files: none
Prior profile: none

## Detected Commands
| Purpose | Command |
| --- | --- |
| build | null |
| test | null |
| test-one | null |
| format | null |
| lint | null |
| typecheck | null |
| run | null |

## Candidate Component Types
- MCP tool handler (planned: the request needs query and update tools)
- database query module (planned: sqlx against PostgreSQL)
- stream publisher (planned: XADD to the Redis cluster)

## Conventions From Instruction Files
none

## Slices (scout these in parallel)
| # | Slice descriptor | Slug | Path(s) |
