# Messaging evals (HANDOVER 10.8). `crates/ostra-server/tests/coordination_evals.rs` runs each case
# as a real session of a real `Engine` on a snapshot of Ostra's own source, with scripted judges. Every run of an
# agent goes to a router: runs the case lists in `live` go to the native loop on the model under test, every other
# run is played from the case's `actor` entries (or a default for its agent). So wakes, message runs, pair-loop
# continuations, and freed slots all go through the engine's own code, and only the runs a case tests cost tokens.
#
# A run address is `agent[:kind][#n]`: the agent, the kind of its purpose (`explore`, `spec`, `fact_check`,
# `implement`, `review`, `message`), and which run of that agent and kind it is, counting every run, a run woken in
# place included. `stop_after` ends the session once a matching run finishes (append `!` to wait for a run that
# ends other than `waiting`); `stop_before` ends it when a matching run is about to start.
#
# Placeholders: {repo} the Ostra snapshot, {root} the session dir, {session} the project's session dir, {ws} the
# workspace. Tiers run from simple to complex:
#   1  answering: a message run (an ended subagent continued for a message) or a woken run answers another
#      subagent's question. An `ask` sends with `wait: true`; a `reply` sends to the subagent that waits.
#   2  deciding: whether to ask, whom, and what; with controls where asking is wrong.
#   3  loops: several live runs of two agents waking each other through the engine.

[project]
key = "ostra"
test_command = "cargo test -p ostra-core"
research = '''
# Research: how the native loop bounds a run

## Code

- `crates/ostra-exec-native/src/lib.rs`: `MAX_TURNS = 400` caps the model turns of one execution. The loop is
  `for _ in 0..MAX_TURNS` in `Run::execute`, and a run that leaves it fails with "The run passed 400 model turns
  without calling submit_<agent>."
- `MAX_TOKEN_CONTINUES = 3`: "continue" turns allowed after the model hits its output limit without a tool call.
- `CLEAR_THRESHOLD_CHARS = 300_000` and `KEEP_TOOL_RESULTS = 12`: above that transcript size old tool results are
  cleared, server-side on Anthropic and by the loop for other providers.

## Not covered

Nothing.
'''

