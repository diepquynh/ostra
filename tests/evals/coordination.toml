[[case]]
id = "t1-message-run-answers-from-its-conversation"
tier = 1
note = "The checker asks the spec author where a number comes from. Only the author's conversation holds the reason, so the message run must answer from it."
request = "Long implementer runs on large repositories hit the native loop's turn cap. Raise the cap so they can finish, and keep the other limits of the loop as they are."
track = "full"
spec = '''
# Spec: a higher turn cap for long native runs

## Requirements

- R1: WHEN a native run passes the turn cap without a submit, THE native loop SHALL fail the run with a message that
  names the cap.
- R2: THE native loop SHALL allow at most 3 continue turns after the output limit.
- R3: THE native loop SHALL raise the turn cap from 400 to 600 model turns.

## Evidence

- R1: `Run::execute` in `crates/ostra-exec-native/src/lib.rs` fails with "The run passed {MAX_TURNS} model turns"
  (research document).
- R2: `MAX_TOKEN_CONTINUES = 3` (research document).
- R3: sized by the author from this workspace's execution history (the longest implementer run).
'''
spec_tools = [{ name = "Bash", input = '''{"command": "sqlite3 -readonly {ws}/.ostra/workspace.db \"SELECT agent, MAX(tool_calls) FROM executions WHERE status = 'ok' GROUP BY agent ORDER BY 2 DESC LIMIT 3\""}''', output = "implementer|540\ncode-reviewer|212\nexplore|188" }]
spec_say = "I read the research document and crates/ostra-exec-native/src/lib.rs. MAX_TURNS is 400 today. To size the new cap I queried this workspace's execution history (the executions table of the workspace database, above): the longest successful implementer run made 540 tool calls, about one per model turn, so it needed roughly 540 turns. I set R3 to 600, which is 540 plus about 10% headroom. I wrote the spec to {root}/ostra-spec-1.md and submitted it."
live = ["generate-spec:message"]
stop_after = ["generate-spec:message"]

[[case.actor]]
run = "fact-check:fact_check#1"
ask_subagent = "generate-spec"
ask = "R3 raises the turn cap to 600, and its evidence says it was sized from this workspace's execution history. I cannot find that history in the research document or the repository. Where does 600 come from?"

[case.expect]
replies = [{ from = "generate-spec:message", has = [["540"], ["headroom", "margin", "10%", "10 %"]] }]
statuses = [{ run = "generate-spec:message", status = "ok" }]
no_writes = ["generate-spec:message"]
cause = "The author set 600 as 540 plus about 10% headroom. 540 comes from its own query of the workspace's execution history (the executions table of the workspace database): the longest successful implementer run made 540 tool calls. No file in the repository holds it."
rubric = """Pass only if all hold: (1) the answer says 600 is the roughly 540-turn longest run plus about 10% headroom; (2) it says where 540 came from: the author's own query of the workspace's execution history (the executions table of the workspace database); (3) it does not invent another source; (4) it does not claim to have changed the spec."""

