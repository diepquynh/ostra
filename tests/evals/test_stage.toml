track = "full"
request = "Let customers cancel an order: POST /orders/<id>/cancel cancels a placed or paid order. A shipped order cannot be cancelled, and cancelling twice is refused; both answer 409."
change = "cancel"
live = ["epa"]
golden = "cancel"
spec = """
# Order cancellation

## Requirements
- R1: WHEN a client sends POST /orders/<id>/cancel for a placed or paid order, THE SYSTEM SHALL store the status cancelled and answer 200 with the order.
- R2: IF the order has shipped, THEN THE SYSTEM SHALL refuse the cancellation with 409 and keep the status shipped.
- R3: IF the order is already cancelled, THEN THE SYSTEM SHALL refuse the cancellation with 409.
- R4: IF no order has the id, THEN THE SYSTEM SHALL answer 404.
"""
phase_file = """
# Phase 1: Order cancellation

**Deliverable:** D1 · **Repo:** shop (`{repo}`) · **Complexity:** Medium · **Test policy:** Required
**Test policy rationale:** Step 1.2 adds the cancel rule with two refusal branches.

## Context

This is the first phase. No prior phases.

## Requirements

- R1: WHEN a client sends POST /orders/<id>/cancel for a placed or paid order, THE SYSTEM SHALL store the status cancelled and answer 200 with the order.
  - AC1.1: Given a placed order, when it is cancelled, then the answer is 200 with status "cancelled", and a later GET /orders/<id> shows "cancelled".
  - AC1.2: Given a paid order, when it is cancelled, then the answer is 200 with status "cancelled".
- R2: IF the order has shipped, THEN THE SYSTEM SHALL refuse the cancellation with 409 and keep the status shipped.
  - AC2.1: Given a shipped order, when it is cancelled, then the answer is 409 and a later GET shows "shipped".
- R3: IF the order is already cancelled, THEN THE SYSTEM SHALL refuse the cancellation with 409.
  - AC3.1: Given a cancelled order, when it is cancelled again, then the answer is 409.
- R4: IF no order has the id, THEN THE SYSTEM SHALL answer 404.
  - AC4.1: Given no order 999, when POST /orders/999/cancel is sent, then the answer is 404.

## Steps

### 1.1 Add the cancelled status
**File:** `shop/domain.py` · **Change:** Modify · **Delivers:** R1
Add the constant `CANCELLED = "cancelled"` next to the other statuses.

### 1.2 Add the cancel rule
**File:** `shop/service.py` · **Change:** Modify · **Delivers:** R1, R2, R3, R4
Add `OrderService.cancel(order_id) -> Order`: get the order (NotFound when missing); raise InvalidState when it is cancelled or shipped; otherwise store the status cancelled with `repo.set_status` and return the order.

### 1.3 Add the route
**File:** `shop/api.py` · **Change:** Modify · **Delivers:** R1, R2, R3, R4
Add `("POST", r"^/orders/(\\d+)/cancel$", "cancel")` to `ROUTES` and `Api.cancel`, answering 200 with `order_json`. `Api.handle` already maps NotFound to 404 and InvalidState to 409.

## Verification

`python3 -m compileall -q shop`
"""
