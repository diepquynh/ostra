[[case]]
id = "cancel-analysis"
tier = 2
note = "A full-track phase that adds a service rule and an HTTP route. Unit paths alone are not enough: the analyzer must trace the route through the real service and repository as a flow at the integration or e2e level, and list the suites of the code it touched."
project = "shop"
others = ["storefront"]
