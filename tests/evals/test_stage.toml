# Test stage evals, run by `crates/ostra-server/tests/test_stage_evals.rs`. Each case is a real session of a real
# engine on a small project from `test_stage/projects/`, and puts the execution path analyzer (`epa`), write-test,
# or both on a live model; every other run is scripted.
#
# A case starts either after an implementation phase (`mode = "phase"`: a scripted implementer applies `change`
# and the engine stages it, on the light or the full track) or as a new session that asks for tests directly
# (`mode = "request"`: the TEST category, where no implementer runs and the agents must find the code under test
# themselves, for example after an earlier session finished without its test stage). `history` commits overlays
# after the first commit, and `staged` leaves one staged, to lay out what an earlier session left behind.
#
# Overlays are folders under `test_stage/changes/<project>/`, copied over the repository. `golden` names a folder
# under `test_stage/goldens/`: `epa.md` stands in for the analyzer when it is not live, and `files/` holds reference
# tests, which the offline test uses to check that every mutant survives the project's own tests and dies against
# a reasonable new suite. `{repo}`, `{session}`, `{ws}`, and `{report}` are filled in per run.
#
# Grading: `epa.has` groups (one alternative of each must appear in the report), `epa.lacks`, and a rubric for the
# grader model. For write-test: the submit status, only test files changed and all of them listed, a changed test
# at each `levels` group, the `run` test types pass, every `mutant` fails them, `files` still hold the given text,
# `has` and `stuck_has` groups, and the rubric.

