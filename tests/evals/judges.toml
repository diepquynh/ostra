# would pick. `crates/ostra-server/tests/judge_evals.rs` builds the session state each judge would see,
# calls the judge several times per model, and scores the answers. Research documents and specs below are
# written from the real code, so a judge that reads them closely has what it needs.
#
# Workspaces: `one` is Ostra as a single project `ostra`; `split` is `server` (the Rust crates) and `web`
# (the React console).

