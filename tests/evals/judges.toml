# Research: ostra-notify

- `VapidKeys` (`generate`, `from_private_bytes`, `jwt`, `authorization`) signs the VAPID JWT with p256.
- `encrypt_with` implements RFC 8291 with an explicit key and salt so the RFC vector is checked; `encrypt` picks
  them at random and refuses a payload over `MAX_PLAINTEXT`.
- `WebPush::send` posts the body with reqwest and maps a 404 or 410 to `NotifyError::Gone`, any other failure
  status to `NotifyError::Status`. No test covers these paths.
- Tests: `rfc8291_test_vector`, `round_trip_with_fresh_keys`, `rejects_oversized_payload`, `vapid_jwt_verifies`,
  `audience_is_origin`, `padded_base64_is_accepted`. No module doc comment explains key storage.
"""

