[[case.research]]
project = "ostra"
task = "Research how review is applied to phases and what the design says about skipping it."
scope = "crates/ostra-engine/src/state.rs, docs/internals/pipeline.md, HANDOVER.md"
findings = "Revision phases use WorkLoop with review Always; docs say no agent can decide to skip the review; Hard rule 21 BLOCKER handling depends on review running."
not_covered = ["Whether security BLOCKER findings may go unreviewed in revisions"]
doc = """
# Research: review on revision phases

- `add_revision_phases` in `state.rs` inserts each revision with `WorkLoop::new(false, Implementer,
  Implementer)`, whose review mode is `Always`. `ReviewMode::Never` exists and is used only for
  `QUICK_CHANGE` and `VERIFY`.
- `docs/internals/pipeline.md` states: "No agent can decide to skip the review."
- Hard rule 21: a BLOCKER security finding loops until removed and blocks module documentation. Its only
  detector is the code reviewer; with no review, a revision could introduce a BLOCKER nobody sees.

The request changes which work is reviewed, and it is silent on security findings.
"""

