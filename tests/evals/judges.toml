[[case]]
id = "track-large-pure-refactor"
judge = "track"
workspace = "one"
request = "Split crates/ostra-engine/src/judge_input.rs into one module per judge under judge_input/, with no behavior change."
note = "Large diff, one area, no contract change: size alone does not decide."
