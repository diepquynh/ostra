[[case.research]]
project = "ostra"
task = "Research how the workspace database stores session data and how materialized tables stay in step with the event log."
scope = "crates/ostra-store/src/workspace.rs, crates/ostra-engine/src/runner.rs, crates/ostra-engine/src/state.rs"
findings = "The workspace database is migrated by an ordered MIGRATIONS array keyed on user_version; materialized tables are written from the runner's append path."
not_covered = ["Whether existing sessions need a backfill of the new table from their events"]
doc = """
# Research: session storage

## Schema and migrations
`crates/ostra-store/src/workspace.rs` holds `const MIGRATIONS: &[&str]`, applied in order by `migrate`,
which reads and bumps `PRAGMA user_version`. Tables include `sessions` (with materialized columns such as
`status`, `lane`, `stage_label`, `cost_usd`), `events` (the append-only log, keyed by session and seq),
`executions`, `gates`, and `decisions`.

## Consistency with the log
`Inner::append` in `runner.rs` stores the event, folds it into `SessionState`, broadcasts, and wakes the
driver. The materialized rows are written from there. The project rule is that a session's state is the fold
of its events; a table derived from them must be rebuilt from the log, never written by itself.

## Open points
A new table means a new migration. Sessions created before it have feedback rounds only in their events, so
either a backfill runs in the migration or the list shows no count for them. The session list endpoint and the
`SessionSummary` API type would both change.
"""

[[case]]
id = "track-yolo-budget"
judge = "track"
workspace = "one"
request = "Let YOLO raise the session budget by itself when the session is less than a dollar over."
expect = { track = "full" }

[[case.research]]
project = "ostra"
task = "Research how the budget gate works and how YOLO treats it."
scope = "crates/ostra-engine/src/plan.rs, crates/ostra-engine/src/state.rs, CLAUDE.md"
findings = "The budget gate is emitted in Planner::push; YOLO explicitly skips BudgetReached gates; the project rules state YOLO never answers a budget gate."
not_covered = ["How many automatic raises should be allowed per session"]
doc = """
# Research: budget gate and YOLO

- `Planner::push` turns any spawn into a `BudgetReached` gate once `spent_usd() >= budget + budget_raised`.
- `Planner::run` answers every open gate under YOLO except `Permission` and `BudgetReached`, with the comment
  "A budget is never raised by YOLO: spending more is the user's decision."
- `CLAUDE.md` pattern 8: "YOLO never answers a budget gate."
- The fold's `BudgetReached` answer adds the raise to `budget_raised`; a missing amount raises by the budget
  again.

The request does not say how much one raise adds, whether raises repeat, or whether a total cap applies, and
the change reverses a stated spend rule.
"""

[[case]]
id = "track-ssh-opt-in"
judge = "track"
workspace = "one"
request = "Add a workspace opt-in that lets agents read ~/.ssh/config, for repos that fetch submodules over ssh."
expect = { track = "full" }

[[case.research]]
project = "ostra"
task = "Research how the sandbox and the policy treat ~/.ssh."
scope = "crates/ostra-sandbox/src/decoy.rs, crates/ostra-policy/src/guards.rs, HANDOVER.md section 8.2 Rule P3"
findings = "~/.ssh holds decoy credential files; reading a secret path is a Layer 1 denial and a containment signal; three signals pause the session."
doc = """
# Research: ~/.ssh inside the sandbox

- `crates/ostra-sandbox/src/decoy.rs` plants decoy keys at `~/.ssh/id_rsa` and `~/.ssh/id_ed25519` where no
  SSH port is reachable. A process opening one is a containment signal (Rule P3).
- The `secret-read` guard in `crates/ostra-policy/src/guards.rs` denies reads of credential paths as a Layer 1
  guard, which no permission, user answer, or YOLO can override.
- Three signals from one execution pause the session.

An opt-in would add a workspace setting, a validation rule at save, a policy exception inside a Layer 1 guard,
and a sandbox mount change, on both the bubblewrap and Seatbelt backends.
"""

