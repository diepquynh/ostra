# Research: SUFFICIENCY_ROUNDS

- Defined in `crates/ostra-engine/src/state.rs:42` as `pub const SUFFICIENCY_ROUNDS: u32 = 3;`.
- Read once, in `Planner::explore_complete` (`plan.rs`): `s.sufficiency_rounds < SUFFICIENCY_ROUNDS`.
- A search of `tests/` and `crates/*/tests` finds no fixture that asserts the value.
- Docs stating "three" or 3: `docs/internals/pipeline.md` (the Sufficiency section and the limits table) and
  `docs/internals/spend-and-limits.md`.

The value is not stored in events, settings, or the API, so existing sessions pick up the new limit on replay
without a migration.
"""

[[case]]
