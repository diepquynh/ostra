[[case.research]]
project = "server"
task = "Find where the gate kind string comes from and where it is stored."
scope = "crates/ostra-core/src/event.rs, crates/ostra-store/src/workspace.rs"
findings = "The kind is the serde tag of GatePayload, written into every stored GateOpened event and the gates table."
doc = """
# Research: gate kind string

- `GatePayload` in `crates/ostra-core/src/event.rs` is `#[serde(tag = "kind", rename_all = "snake_case")]`, so
  the variant `ImplementationReview` serializes as `"kind": "implementation_review"`. `kind_str()` returns the
  same string, and planner step keys include it.
- Every `GateOpened` event is stored as JSON in the `events` table, and the `gates` table keeps the kind. A
  session folded after the rename would fail to deserialize its old events unless the old name is still
  accepted (`#[serde(alias)]`) or the stored rows are migrated.
- `cargo test -p ostra-core` regenerates the TypeScript union in `web/src/api/gen/GatePayload.ts`.
"""

[[case.research]]
project = "web"
task = "Find where the console matches on the gate kind."
scope = "web/src"
findings = "ChoiceGate.tsx, gateAnswers.ts, and gateAnswers.test.ts match on the string."
doc = """
# Research: console uses of the kind

`web/src/features/gates/ChoiceGate.tsx` (two switch arms), `web/src/lib/gateAnswers.ts` (`ANSWER_KIND`,
`ChoiceGateKind`, `CHOICES`), and `web/src/lib/gateAnswers.test.ts` name `implementation_review`. The console
shows old sessions too, so it receives whatever the server sends for stored gates.
"""

[[case]]
id = "track-open-limit"
judge = "track"
workspace = "split"
request = "Let the user set the review cap per session from the New task form."
note = "Looks like a form field, but research finds an open rule (YOLO budget, bounds) and a stored-event shape change."
expect = { track = "full" }

[[case.research]]
project = "server"
task = "Research how the review cap is applied and what a per-session value would touch."
scope = "crates/ostra-engine/src/state.rs, crates/ostra-engine/src/plan.rs, crates/ostra-core/src/event.rs"
findings = "REVIEW_CAP is a constant used by the fold; YOLO uses its own budget of 10; SessionOptions is stored in SessionCreated."
not_covered = ["What the cap means under YOLO, whose budget is 10 passes", "Whether a cap of 0 or above 10 is allowed"]
doc = """
# Research: review cap

- `REVIEW_CAP = 3` in `state.rs` is read by the fold when a review finishes; the 4th pass becomes a
  `review_cap` gate. `YOLO_REVIEW_BUDGET = 10` replaces it under YOLO, after which the Resolve judge decides.
- A per-session value would live in `SessionOptions`, which is stored inside every `SessionCreated` event
  and exported to TypeScript. Old events lack the field, so it needs a serde default.
- The fold must read the cap from the log (pattern 1), so the value must be in the event, not in settings.

## Open
The request does not say whether the user's cap replaces the YOLO budget, stays below it, or is ignored under
YOLO, or what range is valid. Hard rule 21 already puts BLOCKER loops outside any cap.
"""

