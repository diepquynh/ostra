[[case.research]]
project = "ostra"
task = "Map judge_input.rs and everything that imports from it."
scope = "crates/ostra-engine/src/judge_input.rs and its importers"
findings = "780 lines: one judge_input() match with an arm per judge, completion_input, yolo_plan, and helpers. Importers use four public names."
doc = """
# Research: judge_input.rs

## Shape
780 lines. `judge_input(s, kind, subject, projects) -> (String, String)` is one `match kind` with an arm per
judge (Classify, Sufficiency, Stakes, Track, Feedback, RouteAnswer, Rescue, ResolveReview, YoloAnswer,
Completion). `completion_input`, `yolo_plan` with `YoloPlan`, `ProjectFacts`, and the helpers `excerpt`,
`excerpt_n`, and `first_line` sit beside it.

## Importers
- `runner.rs`: `judge_input::judge_input`, `judge_input::yolo_plan`, `YoloPlan`, `ProjectFacts`.
- `crates/ostra-server/tests/judge_evals.rs`: `judge_input`, `ProjectFacts`.
- `tests/conformance/main.rs`: `yolo_plan`, `YoloPlan`.

## Change
Moving each arm into a function in its own module and re-exporting the four public names from
`judge_input/mod.rs` keeps every importer compiling unchanged. The strings the judges receive stay byte for
byte the same, and the offline eval test compares them through the same entry point.
"""

