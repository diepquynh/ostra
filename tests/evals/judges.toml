[[case]]
id = "track-gate-wording"
judge = "track"
workspace = "one"
request = "Make the implementation review gate's explanation say which review round it is."
expect = { track = "light" }

[[case.research]]
project = "ostra"
task = "Find where the implementation review gate's explanation is written and what reads it."
scope = "crates/ostra-engine/src/plan.rs, tests/conformance/main.rs, web/src/features/gates/ChoiceGate.tsx"
findings = "The explanation is one string literal in Planner::implementation_review; the round number is already computed there."
doc = """
# Research: implementation review gate explanation

## Where it is written
`Planner::implementation_review` in `crates/ostra-engine/src/plan.rs` opens the gate with
`self.gate("Review the implementation", "<explanation>", GatePayload::ImplementationReview { round, .. })`.
`round` is `f.rounds.len() as u32 + 1`, computed in the same call. The explanation is a fixed string literal.

## What reads it
- The fold stores the explanation on the `GateOpened` event; nothing parses it.
- Conformance fixtures match the gate by `Step::summary()`, which is `gate implementation_review`, so no
  fixture checks the text.
- The console shows `gate.explanation` verbatim on the card. The payload already carries `round`.

## Change
Format the round into the string in one place. No type, event, schema, or API shape changes.
"""

