doc = """
# Research: gate kind string

- `GatePayload` in `crates/ostra-core/src/event.rs` is `#[serde(tag = "kind", rename_all = "snake_case")]`, so
  the variant `ImplementationReview` serializes as `"kind": "implementation_review"`. `kind_str()` returns the
  same string, and planner step keys include it.
- Every `GateOpened` event is stored as JSON in the `events` table, and the `gates` table keeps the kind. A
  session folded after the rename would fail to deserialize its old events unless the old name is still
  accepted (`#[serde(alias)]`) or the stored rows are migrated.
- `cargo test -p ostra-core` regenerates the TypeScript union in `web/src/api/gen/GatePayload.ts`.
"""

