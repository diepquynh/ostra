]
doc = """
# Research: feedback round limit

- `Planner::implementation_review` opens the gate; the fold counts rounds in `feedback.rounds`.
- Settings reach the planner only through `PlanCtx` (pattern 7); `budget_usd` is the model to copy.
- `WorkspaceSettings.limits` holds `max_parallel_executions` and `session_budget_usd`.
- The settings are validated at save by `validate_workspace` (pattern 7), which this research did not read.
- The setting is plain data read by pure code, with no OS-specific path.
"""

