# Retrieval questions about the engine: the fold, the planner, the runner, judges, and the spawn factory.

[[case]]
id = "engine-001"
kind = "paraphrase"
question = "How does Ostra stop the same step from being started twice while it is still running?"
gold = ["crates/ostra-engine/src/plan.rs", "crates/ostra-engine/src/runner/mod.rs"]

