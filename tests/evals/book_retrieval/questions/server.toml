# Retrieval questions about the server, code navigation, MCP client, Web Push, and a few console behaviors.
# Written from the source, not from docs/ or a book.

# ---- lexical ----

[[case]]
id = "server-001"
kind = "lexical"
question = "What does the guard middleware in api.rs check on every request under /api before the handler runs?"
gold = ["crates/ostra-server/src/api.rs"]

[[case]]
id = "server-002"
kind = "lexical"
question = "How long do COOKIE_TTL_SECS and the one-time token TTL last in auth.rs?"
gold = ["crates/ostra-server/src/auth.rs"]

[[case]]
id = "server-003"
kind = "lexical"
question = "What do MAX_TERM_INPUT and TERM_QUEUE limit on the /ws socket?"
gold = ["crates/ostra-server/src/ws.rs"]

[[case]]
id = "server-004"
kind = "lexical"
question = "Which OSTRA_MASTER_KEY_FILE behavior does master_key.rs implement when the variable is set?"
gold = ["crates/ostra-server/src/master_key.rs"]

[[case]]
id = "server-005"
kind = "lexical"
question = "Which folders does HARNESS_DIRS list for skills that can be adopted into a project?"
gold = ["crates/ostra-server/src/skills.rs"]

[[case]]
id = "server-006"
kind = "lexical"
question = "What does OSTRA_MODELS_DEV_URL change, and how often is the models.dev price cache refreshed?"
gold = ["crates/ostra-server/src/prices.rs"]

[[case]]
id = "server-007"
kind = "lexical"
question = "What are the IDLE and MAX_SERVERS limits of the language server pool?"
gold = ["crates/ostra-code/src/lsp/mod.rs"]

[[case]]
id = "server-008"
kind = "lexical"
question = "Which MCP protocol versions does SUPPORTED_VERSIONS accept, and what is PROTOCOL_VERSION?"
