# Retrieval eval questions: policy, sandbox, native tools, the native agent loop, harness
# executors, and model providers. Written from the source, not the docs.

# ---------------------------------------------------------------------------------------------
# lexical: names an identifier, file, or config key
# ---------------------------------------------------------------------------------------------

[[case]]
id = "exec-001"
kind = "lexical"
question = "What do RECALL_THRESHOLD, WARN_THRESHOLD, and DENY_THRESHOLD control in the build streak?"
gold = ["crates/ostra-policy/src/build.rs"]

[[case]]
id = "exec-002"
kind = "lexical"
question = "Which commands does the READ_ONLY list auto-allow, and which git subcommands count as GIT_READ?"
gold = ["crates/ostra-policy/src/policy.rs"]

[[case]]
id = "exec-003"
kind = "lexical"
question = "What does is_test_path treat as a test file, and which guard uses it to stop the implementer?"
gold = ["crates/ostra-policy/src/guards.rs"]

[[case]]
id = "exec-004"
kind = "lexical"
question = "How does parse_rule read a permission like Bash(npm test:*) compared with Bash(npm run test *)?"
gold = ["crates/ostra-policy/src/perms.rs"]

[[case]]
id = "exec-005"
kind = "lexical"
question = "What is MAX_TURNS in the native loop, and what does COMPACT_AT decide?"
gold = ["crates/ostra-exec-native/src/lib.rs"]

[[case]]
id = "exec-006"
kind = "lexical"
question = "Which hosts are in DEFAULT_ALLOWED_HOSTS for the egress proxy, and what does model_hosts add per harness?"
gold = ["crates/ostra-sandbox/src/egress.rs"]

[[case]]
id = "exec-007"
kind = "lexical"
question = "What does repair_git_dirs undo inside a repository's .git folder?"
gold = ["crates/ostra-sandbox/src/git.rs"]

[[case]]
id = "exec-008"
kind = "lexical"
question = "What is MAX_STOP_NUDGES and what happens when a harness Stop event arrives before submit?"
gold = ["crates/ostra-exec-harness/src/live.rs", "crates/ostra-exec-harness/src/bridge.rs"]

[[case]]
id = "exec-009"
kind = "lexical"
question = "What does INVALID_INPUT_KEY mark on a tool-use block, and how does the agent loop answer it?"
gold = ["crates/ostra-providers/src/anthropic.rs", "crates/ostra-exec-native/src/lib.rs"]

[[case]]
id = "exec-010"
kind = "lexical"
question = "Which paths does runs_code_later cover, such as .envrc or .pre-commit-config.yaml, and why does writing them ask?"
gold = ["crates/ostra-policy/src/policy.rs"]

[[case]]
id = "exec-011"
kind = "lexical"
question = "What are HOME_DECOYS and how many extra decoys may sandbox_decoys add?"
gold = ["crates/ostra-sandbox/src/decoy.rs"]

