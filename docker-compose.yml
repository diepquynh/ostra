# Before the first `docker compose up -d`:
# 1. Create ./config next to this file and give it to UID 1000 / GID 1000, for example:
#      mkdir -p config
#      sudo chown 1000:1000 config
#    A directory the Docker daemon creates on its own is owned by root, and Ostra runs as
#    1000:1000, so it would fail to write /config/config.toml and exit at start.
# 2. Replace the placeholder projects path below on BOTH sides of the projects mount with one
#    absolute host directory that holds the projects and workspaces, owned by or writable by
#    UID 1000.
# 3. After `docker compose up -d`, open http://localhost:7878.

services:
  ostra:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback only, because Ostra serves plain HTTP: reach it from another machine through an
      # SSH tunnel or a TLS reverse proxy, never by publishing the port on every interface.
      - "127.0.0.1:7878:7878"
    stop_signal: SIGINT
    volumes:
      - ostra-data:/data
      # Harness CLIs installed from the setup check land in ~/.local/bin or ~/.grok/bin, and
      # their logins in dot folders here, so the home folder outlives the container.
      - ostra-home:/home/ostra
      - ./config:/config
      # Both halves must be the same absolute host path: Ostra stores workspace and project
      # paths literally, so only projects and workspaces under this directory can be imported
      # or created persistently. It must be writable by UID 1000.
      - /srv/ostra/projects:/srv/ostra/projects

volumes:
  ostra-data: {}
  ostra-home: {}
