[package]
name = "PLUGIN_NAME"
version = "0.1.0"
edition = "2024"

[dependencies]
# Use the tag of the Ostra release that runs the plugin. `ostra --version` prints it.
ostra-sdk = { git = "https://github.com/diepquynh/ostra", tag = "OSTRA_TAG" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
